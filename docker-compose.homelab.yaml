# Deployed compose for the homelab box. Declared as a Komodo stack in
# namanvashistha/homelab -> komodo/syncs/projects.toml.
#
# This is NOT docker-compose.yml. That one is the dev compose: it builds from
# the Dockerfile and publishes ports to localhost. This one pulls the image
# this repo's CI publishes to ghcr.io, uses `expose:` rather than `ports:`
# (ingress is cloudflared -> caddy, so a host port would bypass Cloudflare
# Access and publish to the LAN), and carries the caddy labels that route
# chess.namanvashistha.com.
#
# Komodo clones this repo to /etc/komodo/stacks/chess/ and runs compose there
# under the project name `chess` — which is what the volumes below are prefixed
# with. Renaming the stack renames the volumes and detaches the data silently.

services:
  go-app:
    image: ghcr.io/namanvashistha/chess:latest
    expose:
      - "9000"
    environment:
      - PORT=${PORT:-9000}
      - APPLICATION_NAME=${APPLICATION_NAME:-chess}
      - DB_DSN=${DB_DSN:-host=postgres user=namanvashistha dbname=chess password=your_password port=5432 sslmode=disable}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      # WebSocket origin allowlist. Empty (the default) means same-origin only;
      # set a comma-separated list of origins to permit others, or "*" to allow
      # any origin. See pkg.CheckWebSocketOrigin.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - backend
      - caddy
    labels:
      caddy: http://chess.namanvashistha.com
      caddy.reverse_proxy: "{{upstreams 9000}}"
    healthcheck:
      # alpine base, so busybox wget is present.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Copies the UCI engine and its lichess-bot config out of the chess image and
  # into the shared volume, then exits. Runs on every `up`, so a new engine
  # build reaches the bot just by pulling the image -- no Go on the box, and no
  # binary committed to the repo.
  lichess-config:
    image: ghcr.io/namanvashistha/chess:latest
    command: >
      sh -c "cp /app/uci /app/lichess/config.yml /config/ && chmod 755 /config/uci"
    volumes:
      - lichess_config:/config
    restart: "no"

  # Plays the engine on lichess.org as a declared BOT account, which is what
  # gives it a real, human-calibrated rating. Outbound HTTPS only: no ports, no
  # caddy label, not on the backend network.
  lichess-bot:
    image: ghcr.io/lichess-bot-devs/lichess-bot:latest
    depends_on:
      lichess-config:
        condition: service_completed_successfully
    environment:
      # Overrides the placeholder in config.yml. The token itself lives in the
      # Komodo secret variable, never in this repo.
      - LICHESS_BOT_TOKEN=${LICHESS_API_TOKEN:?set LICHESS_API_TOKEN}
    volumes:
      - lichess_config:/lichess-bot/config
    restart: unless-stopped

  redis:
    image: redis:7.0
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chess}
      - POSTGRES_USER=${POSTGRES_USER:-namanvashistha}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namanvashistha -d chess"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  backend:
    driver: bridge
  caddy:
    external: true

volumes:
  postgres_data:
  redis_data:
  lichess_config:
