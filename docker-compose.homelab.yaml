# Deployed compose for the homelab box. Declared as a Komodo stack in
# namanvashistha/homelab -> komodo/syncs/projects.toml.
#
# This is NOT docker-compose.yml. That one is the dev compose: it builds from
# the Dockerfile and publishes ports to localhost. This one pulls the image
# this repo's CI publishes to ghcr.io, uses `expose:` rather than `ports:`
# (ingress is cloudflared -> caddy, so a host port would bypass Cloudflare
# Access and publish to the LAN), and carries the caddy labels that route
# chess.namanvashistha.com.
#
# Komodo clones this repo to /etc/komodo/stacks/chess/ and runs compose there
# under the project name `chess` — which is what the volumes below are prefixed
# with. Renaming the stack renames the volumes and detaches the data silently.

services:
  go-app:
    image: ghcr.io/namanvashistha/chess:latest
    expose:
      - "9000"
    environment:
      - PORT=${PORT:-9000}
      - DATABASE_URL=${DATABASE_URL:-postgres://namanvashistha:your_password@postgres:5432/chess?sslmode=disable}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Caddy sits in front and sets X-Forwarded-For, so rate limits use it.
      - TRUST_PROXY=true
      # Extra origins allowed to call the API and open sockets. Empty (the
      # default) means same-origin only; "*" allows any.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - caddy
    labels:
      caddy: http://chess.namanvashistha.com
      caddy.reverse_proxy: "{{upstreams 9000}}"
    healthcheck:
      # alpine base, so busybox wget is present. /health answers 503 when
      # Postgres is unreachable; "/" is a static file and would pass
      # with both backends dead.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Plays the engine on lichess.org as a declared BOT account, which is what
  # gives it a real, human-calibrated rating. The image is this repo's engine
  # baked into the upstream lichess-bot image (deploy/lichess/Dockerfile), so a
  # new engine build reaches the bot by pulling, with nothing to copy at start.
  #
  # Outbound HTTPS only: no ports, no caddy label, not on the backend network.
  lichess-bot:
    image: ghcr.io/namanvashistha/chess-lichess-bot:latest
    environment:
      # lichess-bot reads this and it overrides the placeholder in config.yml,
      # so the token lives only in the Komodo secret variable.
      - LICHESS_BOT_TOKEN=${LICHESS_API_TOKEN:?set LICHESS_API_TOKEN}
    restart: unless-stopped


  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chess}
      - POSTGRES_USER=${POSTGRES_USER:-namanvashistha}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namanvashistha -d chess"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  backend:
    driver: bridge
  caddy:
    external: true

volumes:
  postgres_data:
